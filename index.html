<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon HRMS</title>
  <meta name="description" content="Horizon — people management: employees, attendance, time off, payroll and recruitment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    /* Apply the saved theme before first paint to avoid a flash */
    try { var t = localStorage.getItem('horizon-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { }
  </script>
</head>

  <script src="assets/js/pages/timeoff.js"></script>
  <script src="assets/js/pages/payroll.js"></script>
  <script src="assets/js/pages/recruitment.js"></script>
  <script src="assets/js/pages/reports.js"></script>
